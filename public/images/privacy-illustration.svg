<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="300" viewBox="0 0 1024 300">
  <defs>
    <pattern id="p-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#18140d" opacity="0.08"/>
    </pattern>
    <linearGradient id="p-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf0"/>
      <stop offset="1" stop-color="#f3eddd"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="300" fill="url(#p-paper)"/>
  <rect width="1024" height="300" fill="url(#p-dots)"/>
  <rect x="20" y="20" width="984" height="260" fill="#18140d"/>
  <rect x="24" y="24" width="976" height="252" fill="#fdfaf0" stroke="#18140d" stroke-width="2"/>

  <line x1="48" y1="64" x2="976" y2="64" stroke="#d93a11" stroke-width="3"/>
  <text x="48" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#18140d">THE CONFIDENTIAL COLUMN</text>
  <text x="976" y="54" text-anchor="end" font-family="'Courier New', monospace" font-size="13" fill="#746b56" letter-spacing="1">DEADLINE · 26</text>

  <!-- padlock -->
  <g transform="translate(80,96)">
    <rect x="18" y="40" width="96" height="88" rx="8" fill="#403a2c"/>
    <rect x="18" y="40" width="96" height="16" fill="#18140d"/>
    <path d="M40 40 L40 26 A32 32 0 0 1 92 26 L92 40" fill="none" stroke="#18140d" stroke-width="8"/>
    <circle cx="66" cy="80" r="9" fill="#fdfaf0"/>
    <rect x="62" y="88" width="8" height="20" fill="#d93a11"/>
  </g>

  <!-- document with eye (OCR / read) -->
  <g transform="translate(300,76)">
    <rect width="210" height="140" fill="#fdfaf0" stroke="#18140d" stroke-width="2.5"/>
    <rect x="14" y="14" width="60" height="8" fill="#d93a11"/>
    <rect x="14" y="32" width="150" height="6" fill="#18140d" opacity="0.3"/>
    <rect x="14" y="46" width="140" height="6" fill="#18140d" opacity="0.22"/>
    <rect x="14" y="60" width="160" height="6" fill="#18140d" opacity="0.3"/>
    <!-- redacted bar -->
    <rect x="14" y="78" width="120" height="16" fill="#18140d"/>
    <rect x="14" y="100" width="170" height="6" fill="#18140d" opacity="0.22"/>
    <rect x="14" y="112" width="120" height="6" fill="#18140d" opacity="0.3"/>
  </g>

  <!-- shield with check -->
  <g transform="translate(620,76)">
    <path d="M80 0 L160 30 L140 150 L80 180 L20 150 L0 30 Z" fill="#403a2c"/>
    <path d="M80 16 L144 40 L128 142 L80 166 L32 142 L16 40 Z" fill="#fdfaf0" stroke="#18140d" stroke-width="2"/>
    <path d="M52 86 L72 108 L110 62" fill="none" stroke="#d93a11" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- fingerprint circles -->
  <g transform="translate(860,110)" stroke="#403a2c" stroke-width="4" fill="none">
    <circle cx="0" cy="60" r="48" opacity="0.85"/>
    <circle cx="0" cy="58" r="36" opacity="0.6"/>
    <circle cx="0" cy="56" r="24" opacity="0.45"/>
    <circle cx="0" cy="54" r="12" opacity="0.3"/>
    <line x1="-48" y1="60" x2="-60" y2="60" opacity="0.8"/>
    <line x1="48" y1="60" x2="60" y2="60" opacity="0.8"/>
    <line x1="0" y1="108" x2="0" y2="118" opacity="0.8"/>
  </g>

  <g fill="#18140d" transform="translate(48,226)">
    <rect width="3" height="34" opacity="0.9"/>
    <rect x="7" width="5" height="34" opacity="0.85"/>
    <rect x="16" width="2" height="34" opacity="0.7"/>
    <rect x="22" width="5" height="34" opacity="0.9"/>
    <rect x="31" width="3" height="34" opacity="0.75"/>
    <rect x="38" width="6" height="34" opacity="0.9"/>
    <rect x="48" width="2" height="34" opacity="0.7"/>
    <rect x="54" width="4" height="34" opacity="0.85"/>
    <rect x="62" width="5" height="34" opacity="0.9"/>
    <rect x="71" width="3" height="34" opacity="0.75"/>
    <rect x="78" width="2" height="34" opacity="0.7"/>
    <rect x="84" width="6" height="34" opacity="0.9"/>
    <rect x="94" width="3" height="34" opacity="0.8"/>
  </g>
  <text x="48" y="276" font-family="'Courier New', monospace" font-size="11" fill="#746b56" letter-spacing="2">READ · PROTECT · FORGET NOTHING</text>
  <text x="976" y="276" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#403a2c">Your files, your business</text>
</svg>