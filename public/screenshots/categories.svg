      <text x="450" y="132" font-family="Arial" font-size="15" fill="#403a2c">images ⇄ PDF · extract-images</text>
    </g>
    <g>
      <rect x="800" y="30" width="360" height="120" fill="#fdfaf0" stroke="#18140d" stroke-width="3"/>
