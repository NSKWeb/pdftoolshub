      <text x="830" y="112" font-family="Arial" font-size="15" fill="#18140d">OCR · pdf-to-text</text>
      <text x="830" y="132" font-family="Arial" font-size="15" fill="#403a2c">searchable layer, zero system deps</text>
    </g>
    <!-- Row 2 -->
    <g>
      <rect x="40" y="170" width="360" height="120" fill="#fdfaf0" stroke="#18140d" stroke-width="3"/>
      <rect x="46" y="176" width="348" height="108" fill="#fdfaf0"/>
      <text x="70" y="218" font-family="Arial" font-weight="800" font-size="30" fill="#18140d">edit</text>
      <text x="70" y="252" font-family="Arial" font-size="15" fill="#403a2c">watermark · annotate · metadata</text>
      <text x="70" y="272" font-family="Arial" font-size="15" fill="#403a2c">page-numbers · redact</text>
    </g>
    <g>
