      <text x="70" y="78" font-family="Arial" font-weight="800" font-size="30" fill="#d93a11">bind</text>
      <text x="70" y="112" font-family="Arial" font-size="15" fill="#18140d">merge · split · rotate · reorder</text>
      <text x="70" y="132" font-family="Arial" font-size="15" fill="#403a2c">delete · extract · booklet · N-up</text>
    </g>
    <g>
      <rect x="420" y="30" width="360" height="120" fill="#fdfaf0" stroke="#18140d" stroke-width="3"/>
      <rect x="426" y="36" width="348" height="108" fill="#fdfaf0"/>
      <text x="450" y="78" font-family="Arial" font-weight="800" font-size="30" fill="#1b3aa3">convert</text>
