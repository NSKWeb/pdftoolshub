<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#18140d"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#fdfaf0"/>
  <!-- Upload box -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="60" y="90" width="220" height="120" fill="#fdfaf0" stroke="#18140d" stroke-width="3"/>
    <rect x="66" y="96" width="208" height="108" fill="#f7f1e4"/>
    <text x="170" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#18140d">1. Upload</text>
    <text x="170" y="160" text-anchor="middle" font-family="Arial" font-size="13" fill="#403a2c">PDF · images · docs</text>
    <text x="170" y="180" text-anchor="middle" font-family="Arial" font-size="13" fill="#403a2c">multipart/form-data</text>
    <circle cx="105" cy="110" r="9" fill="none" stroke="#d93a11" stroke-width="2"/>
    <text x="105" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#d93a11">1</text>
  </g>
  <!-- arrow -->
  <line x1="280" y1="150" x2="380" y2="150" stroke="#18140d" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Process box -->
  <g>
    <rect x="385" y="90" width="280" height="120" fill="#fdfaf0" stroke="#18140d" stroke-width="3"/>
    <rect x="391" y="96" width="268" height="108" fill="#f7f1e4"/>
    <text x="525" y="135" text-anchor="middle" font-family="Georgia" font-size="20" font-weight="700" fill="#18140d">2. Process</text>
    <text x="525" y="160" text-anchor="middle" font-family="Arial" font-size="13" fill="#403a2c">pdf-lib · pdfjs · tesseract</text>
    <text x="525" y="180" text-anchor="middle" font-family="Arial" font-size="13" fill="#403a2c">server-side, no SaaS queue</text>
    <circle cx="430" cy="110" r="9" fill="none" stroke="#d93a11" stroke-width="2"/>
    <text x="430" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#d93a11">2</text>
  </g>
  <!-- arrow -->
  <line x1="665" y1="150" x2="755" y2="150" stroke="#18140d" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Download box -->
  <g>
    <rect x="760" y="90" width="220" height="120" fill="#fdfaf0" stroke="#18140d" stroke-width="3"/>
    <rect x="766" y="96" width="208" height="108" fill="#f7f1e4"/>
    <text x="870" y="135" text-anchor="middle" font-family="Georgia" font-size="20" font-weight="700" fill="#18140d">3. Download</text>
    <text x="870" y="160" text-anchor="middle" font-family="Arial" font-size="13" fill="#403a2c">processed file back</text>
    <text x="870" y="180" text-anchor="middle" font-family="Arial" font-size="13" fill="#d93a11" font-weight="bold">local · S3 · Cloudinary</text>
    <circle cx="805" cy="110" r="9" fill="none" stroke="#d93a11" stroke-width="2"/>
    <text x="805" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#d93a11">3</text>
  </g>
  <!-- bottom labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#5c6b2a">
    <text x="170" y="245" text-anchor="middle">POST /api/tools/[tool]</text>
    <text x="525" y="245" text-anchor="middle">26 editors run in-process</text>
    <text x="870" y="245" text-anchor="middle">GET /downloads/[key]</text>
  </g>
</svg>