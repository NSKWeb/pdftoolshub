<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Three-step workflow: upload, process, download">
  <defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#18140d" opacity="0.09"/>
  </pattern>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdfaf0"/><stop offset="1" stop-color="#f3eddd"/>
  </linearGradient>
  <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#18140d"/>
  </marker>
  
</defs>
  <rect width="1200" height="320" fill="url(#paper)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="16" y="16" width="1168" height="288" fill="#18140d"/>
  <rect x="20" y="20" width="1160" height="280" fill="#fdfaf0" stroke="#18140d" stroke-width="2"/>
  <line x1="44" y1="66" x2="1156" y2="66" stroke="#d93a11" stroke-width="3"/>
  <text x="44" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#18140d">THE WORKFLOW</text>
  <text x="1156" y="54" text-anchor="end" font-family="'Courier New', monospace" font-size="13" fill="#746b56" letter-spacing="1">UPLOAD → PROCESS → DOWNLOAD</text>

  
  <g transform="translate(60,96)">
    <rect x="6" y="6" width="320" height="150" fill="#18140d"/>
    <rect width="320" height="150" fill="#fdfaf0" stroke="#18140d" stroke-width="2"/>
    <circle cx="42" cy="42" r="20" fill="#d93a11"/>
    <text x="42" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#fdfaf0">1</text>
    <text x="76" y="50" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="#18140d">Upload</text>
    <text x="24" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#403a2c">Drop a PDF, image, or doc.</text>
    <text x="24" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#403a2c">Files stay on your press.</text>
  </g>
  <line x1="396" y1="171" x2="436" y2="171" stroke="#18140d" stroke-width="4" marker-end="url(#tip)"/>
  
  <g transform="translate(452,96)">
    <rect x="6" y="6" width="320" height="150" fill="#18140d"/>
    <rect width="320" height="150" fill="#fdfaf0" stroke="#18140d" stroke-width="2"/>
    <circle cx="42" cy="42" r="20" fill="#1b3aa3"/>
    <text x="42" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#fdfaf0">2</text>
    <text x="76" y="50" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="#18140d">Process</text>
    <text x="24" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#403a2c">26 engines run in-process.</text>
    <text x="24" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#403a2c">No third-party SaaS queue.</text>
  </g>
  <line x1="788" y1="171" x2="828" y2="171" stroke="#18140d" stroke-width="4" marker-end="url(#tip)"/>
  
  <g transform="translate(844,96)">
    <rect x="6" y="6" width="296" height="150" fill="#18140d"/>
    <rect width="296" height="150" fill="#fdfaf0" stroke="#18140d" stroke-width="2"/>
    <circle cx="42" cy="42" r="20" fill="#5c6b2a"/>
    <text x="42" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#fdfaf0">3</text>
    <text x="76" y="50" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="#18140d">Download</text>
    <text x="24" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#403a2c">Get the result straight back.</text>
    <text x="24" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#403a2c">Deleted after 1 hour.</text>
  </g>

  <g font-family="'Courier New', monospace" font-size="13" fill="#403a2c">
    <text x="220" y="278" text-anchor="middle">POST /api/tools/[tool]</text>
    <text x="612" y="278" text-anchor="middle">pdf-lib · pdfjs · tesseract</text>
    <text x="992" y="278" text-anchor="middle">GET /downloads/[key]</text>
  </g>
</svg>